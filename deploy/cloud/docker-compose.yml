# HeroMarket cloud – the internet way in to one store (Phase 2, D-101, D-105).
#
#   cp deploy/cloud/cloud.env.example deploy/cloud/.env     fill in the values (see the file)
#   docker compose -f deploy/cloud/docker-compose.yml up -d --build
#
# Four containers:
#   db      PostgreSQL 17: the cloud's copy of the store. Never published.
#   cloud   the HeroMarket service in its cloud role and the browser screens. Never published.
#   proxy   Caddy: HTTPS on 443 with a certificate from Let's Encrypt for HEROMARKET_DOMAIN,
#           port 80 only to answer the certificate check and redirect to HTTPS.
#   backup  an encrypted copy of the database every night (deploy/cloud/backup.sh): only the holder
#           of the private key (the owner, not the server) can read it.
#
# See .docs/CLOUD_DEPLOYMENT.md for the whole procedure, the restore and the firewall.
name: heromarket-cloud

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: heromarket
      POSTGRES_USER: heromarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/cloud/.env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [inside]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heromarket -d heromarket']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  cloud:
    build:
      context: ../..
      dockerfile: Dockerfile.cloud
    # Tagged by release (deploy/cloud/update.sh), so the previous one can always start again.
    image: heromarket-cloud:${HEROMARKET_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HEROMARKET_DATABASE_URL: postgres://heromarket:${POSTGRES_PASSWORD}@db:5432/heromarket
      HEROMARKET_SECRET: ${HEROMARKET_SECRET:?set HEROMARKET_SECRET in deploy/cloud/.env (at least 32 characters)}
      HEROMARKET_TIMEZONE: ${HEROMARKET_TIMEZONE:-Africa/Cairo}
      HEROMARKET_LOG_LEVEL: ${HEROMARKET_LOG_LEVEL:-info}
      # Only the proxy (its fixed address below) may say who the visitor is (D-105).
      HEROMARKET_TRUST_PROXY: 172.31.250.10
    expose:
      - '8787'
    networks:
      inside:
        ipv4_address: 172.31.250.20
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      cloud:
        condition: service_healthy
    environment:
      HEROMARKET_DOMAIN: ${HEROMARKET_DOMAIN:?set HEROMARKET_DOMAIN in deploy/cloud/.env}
      HEROMARKET_ACME_EMAIL: ${HEROMARKET_ACME_EMAIL:?set HEROMARKET_ACME_EMAIL in deploy/cloud/.env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      inside:
        ipv4_address: 172.31.250.10
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    image: heromarket-cloud-backup:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['/bin/bash', '/backup/backup.sh']
    environment:
      PGHOST: db
      PGUSER: heromarket
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: heromarket
      # The owner's public key (age1…): copies are encrypted to it; the private key never comes here.
      BACKUP_RECIPIENT: ${BACKUP_RECIPIENT:?set BACKUP_RECIPIENT (the owner's age public key) in deploy/cloud/.env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: ${HEROMARKET_TIMEZONE:-Africa/Cairo}
      # Optional off-server copy (S3-compatible storage such as Backblaze B2 or Cloudflare R2).
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: 'true'
    volumes:
      - ./backup.sh:/backup/backup.sh:ro
      - backups:/backups
    networks: [inside]
    security_opt:
      - no-new-privileges:true

networks:
  inside:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
