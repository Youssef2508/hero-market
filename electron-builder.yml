# appId and package name are unchanged so existing installs upgrade in place (D-005).
appId: com.electron.app
productName: HeroMarket POS
copyright: Copyright © HeroMarket
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
extraResources:
  - from: "./sqlite3.exe"
    to: "sqlite3.exe"
  - from: "./typst.exe"
    to: "typst.exe"
  - from: "./market_unified.db"
    to: "market_unified.db"
  - from: "resources/print_receipt.ps1"
    to: "print_receipt.ps1"
  - from: "resources/logo.png"
    to: "logo.png"
  - from: "resources/brand/png/heromarket-mark-256.png"
    to: "brand-logo.png"
asarUnpack:
  - resources/**
win:
  executableName: HeroMarket-POS
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: HeroMarket-POS-${version}-setup.${ext}
  shortcutName: "HeroMarket POS"
  uninstallDisplayName: "HeroMarket POS"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: HeroMarket
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
