# appId and package name are unchanged so existing installs upgrade in place (D-005).
appId: com.electron.app
productName: HeroMarket POS
copyright: Copyright © HeroMarket
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/*'
  # The HeroMarket service runs inside the main process (local and standalone modes).
  - 'src/server/**'
  - 'src/shared/**'
  # Never package local data, credentials, backups or development material.
  - '!{.pgdata,.migration-backups,.docs,docs,tests,scripts,scratch,pdf,dist,coverage,build}/**'
  - '!**/*.{db,db-wal,db-shm,db-journal,log}'
  - '!{sqlite3.exe,typst.exe,*.bat,AUDIT_REPORT.md,BUSINESS_AUDIT_REPORT.md,implementation_plan.md,fix_tofixed*.js,Dockerfile*,docker-compose*.yml,.dockerignore}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
extraResources:
  - from: "./typst.exe"
    to: "typst.exe"
  - from: "resources/print_receipt.ps1"
    to: "print_receipt.ps1"
  - from: "resources/logo.png"
    to: "logo.png"
  - from: "resources/brand/png/heromarket-mark-256.png"
    to: "brand-logo.png"
asarUnpack:
  - resources/**
win:
  executableName: HeroMarket-POS
  icon: build/icon.ico
  # PostgreSQL server binaries for the managed local database (src/main/localDatabase.js).
  # The pgAdmin GUI libraries and link-time .lib files are not needed to run the server.
  extraResources:
    - from: node_modules/@embedded-postgres/windows-x64/native
      to: pgsql
      filter:
        - '**/*'
        - '!bin/wx*.dll'
        - '!bin/testplug.dll'
        - '!lib/*.lib'
# Installer (.docs/INSTALLATION_GUIDE.md): one click, no admin rights, installs for the current
# Windows user under %LOCALAPPDATA%ProgramsHeroMarket POS, creates Desktop and Start Menu
# shortcuts and starts the app. Upgrading = running a newer installer: the program files are
# replaced, the store's data in %APPDATA%HeroMarket is never touched by the installer (the app
# itself takes a verified snapshot before migrating, src/main/upgradeSnapshot.js). Uninstalling
# removes the program and keeps the data.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: HeroMarket-Setup-${version}.${ext}
  shortcutName: "HeroMarket POS"
  uninstallDisplayName: "HeroMarket POS"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: HeroMarket
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
