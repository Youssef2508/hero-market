# appId and package name are unchanged so existing installs upgrade in place (D-005).
appId: com.electron.app
productName: HeroMarket POS
copyright: Copyright © HeroMarket
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/*'
  # The HeroMarket service runs inside the main process (local and standalone modes).
  - 'src/server/**'
  # The cloud side of synchronisation never runs on the cashier PC.
  - '!src/server/cloud/**'
  - 'src/shared/**'
  # Never package local data, credentials, backups or development material.
  - '!{.pgdata,.migration-backups,.docs,docs,tests,scripts,scratch,pdf,dist,coverage,build}/**'
  - '!**/*.{db,db-wal,db-shm,db-journal,log}'
  - '!{sqlite3.exe,typst.exe,*.bat,AUDIT_REPORT.md,BUSINESS_AUDIT_REPORT.md,implementation_plan.md,fix_tofixed*.js,Dockerfile*,docker-compose*.yml,.dockerignore}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
extraResources:
  - from: "./typst.exe"
    to: "typst.exe"
  - from: "resources/print_receipt.ps1"
    to: "print_receipt.ps1"
  - from: "resources/logo.png"
    to: "logo.png"
  - from: "resources/brand/png/heromarket-mark-256.png"
    to: "brand-logo.png"
asarUnpack:
  - resources/**
# Hardening of the packaged program (1.4.0 audit): HeroMarket-POS.exe cannot be used as a plain
# Node.js runtime (ELECTRON_RUN_AS_NODE), ignores NODE_OPTIONS and the --inspect / remote debugging
# switches, and only runs the app.asar it was built with (integrity checked at start).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: HeroMarket-POS
  icon: build/icon.ico
  # PostgreSQL server binaries for the managed local database (src/main/localDatabase.js).
  # The pgAdmin GUI libraries and link-time .lib files are not needed to run the server.
  extraResources:
    - from: node_modules/@embedded-postgres/windows-x64/native
      to: pgsql
      filter:
        - '**/*'
        - '!bin/wx*.dll'
        - '!bin/testplug.dll'
        - '!lib/*.lib'
# Installer (.docs/INSTALLATION_GUIDE.md), version 1.4.0: per machine. One click after the Windows
# administrator prompt; installs under C:\Program Files\HeroMarket-POS for every Windows user of the
# PC, creates Desktop and Start Menu shortcuts for all users and starts the app. The store's data
# lives in %ProgramData%\HeroMarket (shared by all users, src/main/userDataPath.js) and is never
# touched by the installer: upgrading = running a newer installer (the app itself takes a verified
# snapshot before migrating, src/main/upgradeSnapshot.js); uninstalling removes the program and
# keeps the data.
nsis:
  # Installs the Microsoft Visual C++ runtime the database needs when a clean PC lacks it.
  include: build/installer.nsh
  oneClick: true
  perMachine: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: HeroMarket-Setup-${version}.${ext}
  shortcutName: "HeroMarket POS"
  uninstallDisplayName: "HeroMarket POS"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: HeroMarket
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
